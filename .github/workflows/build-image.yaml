name: Frontend Docker Build and Push

on:
  push:
    branches:
      - dev

jobs:
  test:
    name: Run Pytest
    runs-on: self-hosted
    strategy:
      matrix:
        python-version: [3.14]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Install uv and set up automated caching + Python version
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      # Install project dependencies into the virtual environment
      - name: Install dependencies
        run: uv sync --all-extras --dev

      # Execute pytest within the uv virtual environment
      - name: Run test suite with Pytest
        run: uv run pytest tests/ --junitxml=test-results.xml

      # Upload test results artifact for CI reporting
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ matrix.python-version }}
          path: test-results.xml

  build-and-push:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get Image Tag
        id: image
        shell: powershell
        run: |
          "tag=${{ github.sha }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Login to Nexus Docker Registry
        run: docker login "${{ secrets.NEXUS_REGISTRY }}" -u "${{ secrets.NEXUS_USERNAME }}" -p "${{ secrets.NEXUS_PASSWORD }}"
          
      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.NEXUS_REGISTRY }}/frontend:${{ steps.image.outputs.tag }} .

      - name: Push Docker image to Nexus
        run: |
          docker push ${{ secrets.NEXUS_REGISTRY }}/frontend:${{ steps.image.outputs.tag }}

      - name: Verify image exists
        run: |
          docker images | Select-String "${{ steps.image.outputs.tag }}"
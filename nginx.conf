server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }

    location /hotels {
        proxy_pass http://backend.hotel-backend.svc.cluster.local:3000;
    }

    location /reservations {
        proxy_pass http://backend.hotel-backend.svc.cluster.local:3000;
    }
}
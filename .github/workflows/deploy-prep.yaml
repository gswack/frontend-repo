name: Pipeline 2 - Frontend Deployment Preparation

on:
  workflow_run:
    workflows:
      - "Frontend Docker Build and Push"
    types:
      - completed

jobs:
  update-infra:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: self-hosted

    steps:
      - name: Checkout infra-repo
        uses: actions/checkout@v4
        with:
          repository: gswack/infra-repo
          token: ${{ secrets.PIPELINE_TOKEN }}
          ref: dev
          path: infra-repo

      - name: Set image tag from workflow run
        id: tag
        shell: powershell
        run: |
          echo "tag=${{ github.event.workflow_run.head_sha }}" >> $env:GITHUB_OUTPUT

      - name: Update frontend image tag
        shell: powershell
        run: |
          $tag = "${{ steps.tag.outputs.tag }}"

          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw "Image tag is empty. Cannot update deployment."
          }

          Write-Host "Updating frontend image to: $tag"

          (Get-Content infra-repo/kubernetes/frontend/frontend-deployment.yaml) `
          -replace 'host\.docker\.internal:8082/frontend:.*', "host.docker.internal:8082/frontend:$tag" |
          Set-Content infra-repo/kubernetes/frontend/frontend-deployment.yaml

      - name: Verify updated manifest
        shell: powershell
        run: |
          Get-Content infra-repo/kubernetes/frontend/frontend-deployment.yaml | Select-String "image:"

      - name: Commit and push changes
        shell: powershell
        run: |
          cd infra-repo
          git config --global --add safe.directory "$pwd"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add kubernetes/frontend/frontend-deployment.yaml
          git commit -m "Update frontend image tag to latest"
          git push origin dev

      - name: Open Pull Request
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
        run: |
          gh pr create `
            --repo gswack/infra-repo `
            --base main `
            --head dev `
            --title "Deploy frontend latest" `
            --body "Automated PR: update frontend image tag to latest"

      - name: Auto-merge Pull Request
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
        run: |
          $PR_NUMBER = gh pr list `
            --repo gswack/infra-repo `
            --head dev `
            --json number `
            --jq ".[0].number"

          if (-not $PR_NUMBER) {
            throw "No open PR found for dev branch."
          }

          gh pr merge $PR_NUMBER `
            --repo gswack/infra-repo `
            --merge `
            --admin
